<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>Company Registration</title>
</head>

<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="{{ url_for('static', filename='logo.png') }}" width="36" height="36">
      <span class="fw-semibold">Placement Portal</span>
    </a>
    
  </div>
</nav>

    <div class = "container align-items-center d-flex justify-content-center" style = "min-height: 90vh;">
        <div class = "card shadow-sm p-5" style = "max-width: 500px; width: 100%;">
            <div id="form" >
          <h3 class = "text-center mb-4">Company Registration</h3>
          <form method="POST" action="{{ url_for('auth.register_company') }}">
            <div class="mb-4">
              <label for="name" class="form-label">Name</label>
              <input class="form-control form-control-lg" type="text" class="form-control" id="name" name="name" aria-describedby="emailHelp"/>
            </div>
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <input class="form-control form-control-lg" type="email" class="form-control" id="email" name="email" />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input class="form-control form-control-lg" type="password" class="form-control" id="password" name="password" />
            </div>
            <div class="mb-4">
              <label for="company_description" class="form-label">Company Description</label>
              <textarea class="form-control form-control-lg" id="company_description" name="company_description" rows="3"></textarea>
            </div>
            
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary w-100">Register</button>
          <p class="mt-3 mb-0 small">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}">Login</a>
          </p>
        </div>
          </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>Create Drive</title>
    <style>
        #form{
            width: 500px;
            height: 615px;
            margin-top: 100px;
        }
    </style>
</head>
<body>
            <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/docs/5.3/assets/brand/bootstrap-logo.svg"  width="40" height="24" class="d-inline-block align-text-top">
      Placement Portal
      <img src="/docs/5.3/assets/brand/bootstrap-logo.svg"  width="40" height="24" class="d-inline-block align-navbar-right">
    </a>
  </div>
</nav>
    <div id = "main">
        <div id = "canvas">
            <div id="form" >
          <h2>Create a Placement Drive</h2><br>
<form method="POST" action="{{ url_for('company.create_drive') }}">

  <div class="mb-3">
    <label class="form-label">Job Title</label>
    <input type="text" class="form-control" name="job_title" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Job Description</label>
    <textarea class="form-control" name="job_description" rows="3" required></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Eligibility Criteria</label>
    <textarea class="form-control" name="eligibility_criteria" rows="2" required></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Application Deadline</label>
    <input type="date" class="form-control" name="application_deadline" required>
  </div>

  <div class="text-center">
    <input type="submit" class="btn btn-success" value="Create Drive">
    <br><br>
    <a href="{{ url_for('company.company_dashboard') }}" class="btn btn-outline-dark">Back</a>
  </div>

</form>
        </div>
    </div>
    
</body>
</html>

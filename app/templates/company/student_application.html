<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Student Application</title>
</head>
<body>

<div class="container mt-4">

    <h3>Student Application</h3>
    <hr>

    <p><strong>Student Name:</strong> {{ student.student_name }}</p>
    <p><strong>Education:</strong> {{ student.education }}</p>
    <p><strong>Drive:</strong> {{ drive.id }}</p>
    <p><strong>Job Title:</strong> {{ drive.job_title }}</p>

    <br>

    <!-- Resume Button -->
    <a href="{{ url_for('static', filename=student.resume_path) }}" target="_blank" 
       class="btn btn-primary btn-sm">
        View Resume
    </a>

    <br><br>

    <!-- STATUS UPDATE FORM -->
    <form method="POST" action="{{ url_for('company.update_student_application_status', application_id=student_application.id) }}">

        <div class="mb-3" style="width:200px;">
            <label class="form-label">Update Status</label>
            <select class="form-select" name="status">
                <option value="Waiting" {% if student_application.status == "Waiting" %}selected{% endif %}>Waiting</option>
                <option value="Shortlisted" {% if student_application.status == "Shortlisted" %}selected{% endif %}>Shortlisted</option>
                <option value="Rejected" {% if student_application.status == "Rejected" %}selected{% endif %}>Rejected</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success btn-sm">Save</button>

    </form>

    <br>

    <a href="{{ url_for('company.drive_applications', drive_id=drive.id) }}" 
       class="btn btn-outline-dark btn-sm">
        Back
    </a>

</div>

</body>
</html>

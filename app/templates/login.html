<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>Login</title>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="{{ url_for('static', filename='logo.png') }}" width="36" height="36">
      <span class="fw-semibold">Placement Portal</span>
    </a>
    
  </div>
</nav>

    <div class = "container align-items-center d-flex justify-content-center" style = "min-height: 85vh;">
        <div class = "card shadow-sm p-5" style = "max-width: 420px; width: 100%;">
            <div id="form">
          <h3 class = "text-center mb-4">Login</h3>
          <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" />
            </div>
            <div class="mt-4">
              <button type="submit" class="btn btn-primary px-4 w-100">Login</button>
              <div class = "text-center mt-4 ">
                <p class = "mb-1">
                  New Student ? 
                  <a href="{{ url_for('auth.register_student') }}">Register</a>                
                </p>
                <p class = "mb-1">
                  New Company ?
                  <a href="{{ url_for('auth.register_company') }}">Register</a>
                </p>
              </div>
            </div>
          </form>
        </div>
    </div>
    
</body>
</html>

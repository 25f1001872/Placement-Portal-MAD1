<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>Login</title>
    <style>
        
    </style>
</head>
<body>
            <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/docs/5.3/assets/brand/bootstrap-logo.svg"  width="40" height="24" class="d-inline-block align-text-top">
      Placement Portal
      <img src="/docs/5.3/assets/brand/bootstrap-logo.svg"  width="40" height="24" class="d-inline-block align-navbar-right">
    </a>
  </div>
</nav>
    <div id = "main">
        <div id = "canvas">
            <div id="form" >
          <h2>Login Form</h2><br>
          <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" />
            </div>
            <br>
            <div class="text-center">
              <input
                type="submit"
                class="btn btn-primary"
                value="login"
              /><br><br>
              Have an student Account? <a href="{{ url_for('auth.register_student') }}">Register</a> <br>
              Have an company Account? <a href="{{ url_for('auth.register_company') }}">Register</a>
            </div>
          </form>
        </div>
    </div>
    
</body>
</html>

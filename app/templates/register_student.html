<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>Student Registration</title>
    <style>
        #form{
            width: 400px;
            height: 500px;
            margin-top: 100px;
        }
    </style>
</head>
<body>
            <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/docs/5.3/assets/brand/bootstrap-logo.svg"  width="40" height="24" class="d-inline-block align-text-top">
      Placement Portal
      <img src="/docs/5.3/assets/brand/bootstrap-logo.svg"  width="40" height="24" class="d-inline-block align-navbar-right">
    </a>
  </div>
</nav>
    <div id = "main">
        <div id = "canvas">
            <div id="form" >
          <h2>Register Form</h2><br>
          <form method="POST" action="{{ url_for('auth.register_student') }}" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" />
            </div>
            <br>
            <div class="mb-2"> 
              <label for="resume" class="form-label">Upload Resume (PDF)</label>
              <input type="file" name="resume" accept=".pdf" required> </div>
            <div class="text-center">
              <input
                type="submit"
                class="btn btn-primary"
                value="Register"
              /><br><br>
              Already Have an Account? <a href="{{ url_for('auth.login') }}">Login</a>
            </div>
          </form>
        </div>
    </div>
    
</body>
</html>

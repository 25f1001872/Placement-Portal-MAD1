<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>Student Registration</title>
</head>

<body>
<nav class="navbar navbar-expand-lg  border-bottom" id="navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="{{ url_for('static', filename='logo.svg') }}" width="36" height="36">
      <span class="fw-semibold">Placement Portal</span>
    </a>

    <div class="ms-auto">
      <a href="{{ url_for('auth.home') }}" class="btn btn-outline-dark btn-sm">
        Home
      </a>
    </div>

  </div>
</nav>

<div class = "container align-items-center d-flex justify-content-center" style = "min-height: 85vh;">
    <div class = "card shadow-sm p-5" id="main-card"  style = "max-width: 600px; width: 100%;">
      <h3 class = "text-center mb-4">Student Registration</h3>
      <form method="POST" action="{{ url_for('auth.register_student') }}" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" aria-describedby="emailHelp"/>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" />
        </div>
        <div class="mb-3">
          <label for="education" class="form-label">Education</label>
          <textarea class="form-control" id="education" name="education" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label for="skills" class="form-label">Skills</label>
          <textarea class="form-control" id="skills" name="skills" rows="2"></textarea>
        </div>

        <div class="mb-3"> 
          <label for="resume" class="form-label">Upload Resume (PDF)</label>
          <input class="form-control" type="file" id = "resume" name="resume" accept=".pdf" required> 
          <div class = "form-text">Only PDF files are allowed.</div>
        </div>
   
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary w-100">Register</button>
            <p class="mt-3 mb-0 small">
              Already have an account? 
              <a href="{{ url_for('auth.login') }}">Login</a>
            </p>
          </div>

      </form>

   </div>
</div>
    
</body>
</html>
